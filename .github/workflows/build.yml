name: Build MEATGRINDER VST3

# Push this folder to a GitHub repository and the VST3 for Windows, macOS and Linux
# is built for you.  Download the result from the run's "Artifacts" section.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows }
          - { os: macos-latest,   name: macOS }
          - { os: ubuntu-latest,  name: Linux }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev \
            libfontconfig1-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DMEATGRINDER_BUILD_TESTS=ON

      - name: Build the VST3
        run: cmake --build build --config Release --target MeatGrinder_VST3 --parallel

      - name: Build the DSP tests
        run: cmake --build build --config Release --target MeatGrinderDspTests --parallel

      - name: Run the DSP tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./build/Release/MeatGrinderDspTests.exe
          else
            ./build/MeatGrinderDspTests
          fi

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - "build/MeatGrinder_artefacts/Release/VST3/MEATGRINDER.vst3"

      - name: Upload the VST3
        uses: actions/upload-artifact@v4
        with:
          name: MEATGRINDER-VST3-${{ matrix.name }}
          path: build/MeatGrinder_artefacts/Release/VST3/MEATGRINDER.vst3
